<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello · go-base</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 15% 5%, #e8f0ff 0%, #f6f8fc 55%, #ffffff 100%);
    color: #1b2431;
  }
  .card {
    width: min(560px, 100%);
    padding: 48px 44px;
    background: #ffffff;
    border: 1px solid rgba(27, 36, 49, .07);
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(27, 36, 49, .12), 0 2px 6px rgba(27, 36, 49, .05);
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #2f6fed;
    background: #eef3ff;
    border-radius: 999px;
  }
  h1 {
    margin: 18px 0 10px;
    font-size: 40px;
    line-height: 1.15;
    letter-spacing: -.02em;
  }
  h1 span { color: #2f6fed; }
  .lead {
    margin: 0 0 28px;
    font-size: 16px;
    line-height: 1.7;
    color: #5a6675;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
  }
  .links a {
    padding: 8px 14px;
    font-size: 14px;
    color: #1b2431;
    text-decoration: none;
    background: #f4f6fa;
    border-radius: 10px;
    transition: background .15s ease, color .15s ease;
  }
  .links a:hover { background: #e8efff; color: #2f6fed; }
  .meta {
    display: flex;
    justify-content: space-between;
    padding-top: 20px;
    font-size: 13px;
    color: #8a94a3;
    border-top: 1px solid #eef1f5;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">go-base</span>
    <h1>Hello，<span>世界</span> 👋</h1>
    <p class="lead">页面已经跑起来了。这是一个静态示例页，接下来可以在这里接入模板数据和真实的业务页面。</p>
    <div class="links">
      <a href="/api/v1/hello">接口 /api/v1/hello</a>
      <a href="/metrics">指标 /metrics</a>
    </div>
    <div class="meta">
      <span>本地时间</span>
      <span id="clock">--</span>
    </div>
  </main>
  <script>
    const el = document.getElementById('clock');
    const render = () => { el.textContent = new Date().toLocaleString('zh-CN', { hour12: false }); };
    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
